services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      # Container socket — required for Lambda, RDS, ElastiCache, ECS, EC2.
      # Docker:  /var/run/docker.sock:/var/run/docker.sock
      # Podman:  ${PODMAN_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Persistent storage — survives container restarts.
      - ./data:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid     # in-process services + real Docker containers
      FLOCI_LOG_LEVEL: info          # debug | info | warn | error
      FLOCI_DATA_DIR: /app/data
      # Let the visual console UI sidecar connect to local Azure on Podman
      FLOCI_SERVICES_UI_AZ_ENDPOINT: http://host.containers.internal:4577
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_floci/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ── Usage ───────────────────────────────────────────────────────────────────
#
#  Docker:
#    docker compose up -d
#    docker compose logs -f floci
#    docker compose down          # stop (data kept)
#    docker compose down -v       # stop + delete volume
#
#  Podman (set the socket path first):
#    export CONTAINER_SOCK=$(podman machine inspect \
#      --format '{{.ConnectionInfo.PodmanSocket.Path}}')
#    podman-compose up -d
#
#  AWS env vars (export in your shell):
#    export AWS_ENDPOINT_URL=http://localhost:4566
#    export AWS_ACCESS_KEY_ID=test
#    export AWS_SECRET_ACCESS_KEY=test
#    export AWS_DEFAULT_REGION=us-east-1
#
#  Or use the helper:
#    eval $(bash aws/scripts/env.sh)
