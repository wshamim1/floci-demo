services:
  floci-az:
    image: floci/floci-az:latest
    container_name: floci-azure
    ports:
      - "4577:4577"   # Consolidated Azure Emulator Port
    volumes:
      # Socket is required for local Azure Functions execution
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Persistent storage
      - ./data:/app/data
    environment:
      - FLOCI_AZ_STORAGE_MODE=hybrid  # in-memory performance with 5s async flushing
      - FLOCI_AZ_STORAGE_PATH=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4577/_floci/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

